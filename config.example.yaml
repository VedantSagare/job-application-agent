# Copy to config.yaml and edit. Everything here is read by `python -m jobagent ...`.

search:
  # Job titles / keywords to search for on LinkedIn and Naukri.
  keywords:
    - "Backend Developer"
    - "Backend Engineer"

  locations:
    - "Bengaluru"
    - "Remote"
    -"Hyderabad"
  # Only keep career-portal jobs whose title contains one of these words (case-insensitive).
  # Leave empty to keep every job from the listed companies.
  title_must_include:
    - "engineer"
    - "developer"
  # Drop jobs whose title contains any of these.
  title_exclude:
    - "principal"
    - "staff"
    - "director"
    - "intern"
  # Drop career-portal jobs whose location doesn't mention one of these (empty = keep all).
  location_include:
    - "india"
    - "bengaluru"
    - "bangalore"
    - "remote"
  # Scoring order: jobs whose location/source matches earlier entries are scored first.
  priority_locations: ["india", "naukri", "bengaluru", "remote"]
  max_age_days: 14          # LinkedIn "posted within" filter
  min_match_score: 60      # jobs scoring below this are marked "skipped"

sources:
  linkedin:
    enabled: true
    pages: 3                # ~10 jobs per page, per keyword x location
  naukri:
    enabled: true
    pages: 1                # 20 jobs per page; opens a visible Edge window
  # Company career portals. Use the board slug from the careers URL:
  #   Greenhouse: https://job-boards.greenhouse.io/<slug>   or boards.greenhouse.io/<slug>
  #   Lever:      https://jobs.lever.co/<slug>
  #   Ashby:      https://jobs.ashbyhq.com/<slug>
  companies:
    greenhouse: [stripe, databricks]
    lever: [palantir]
    ashby: [ramp]

llm:
  # subscription = use your Claude Pro/Max login via the Claude Code CLI (no API credits needed)
  # api          = use ANTHROPIC_API_KEY from .env (pay-as-you-go API credits)
  backend: subscription
  # claude_cli: "C:/path/to/claude.exe"   # optional; auto-detected (PATH or the VS Code extension)
  model: claude-opus-5
  # Effort per task: low | medium | high | xhigh | max
  score_effort: low
  tailor_effort: high
  form_effort: medium

browser:
  channel: chrome           # chrome or msedge (Edge is built into Windows)
  profile_dir: .browser_profile   # persistent profile, so you stay logged in to LinkedIn/Naukri

# Facts used to answer application-form questions that aren't in your resume.
# The agent never invents answers: anything it can't answer from here or your resume is left blank for you.
applicant:
  phone: "+91 90000 00000"
  linkedin_url: "https://www.linkedin.com/in/your-handle"
  github_url: "https://github.com/your-handle"
  portfolio_url: ""
  current_location: "Bengaluru, India"
  willing_to_relocate: "Yes"
  work_authorization: "Indian citizen; authorized to work in India. Requires visa sponsorship for other countries."
  notice_period: "30 days"
  current_ctc: ""
  expected_ctc: ""
  years_of_experience: ""
  gender: ""                # leave blank to skip voluntary EEO questions
  how_did_you_hear: "Company careers page"
